<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VORZ BAR Darts Contest</title>

<!-- ▼ LINEやX、Facebook等で共有したときのプレビュー用（OGP） -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://heso710soul-ctrl.github.io/VDC/">
<meta property="og:title" content="VORZ BAR Darts Contest">
<meta property="og:description" content="VORZ BARで行われたダーツ大会の記録。歴代の優勝者と各回の結果をまとめています。">
<meta property="og:image" content="https://heso710soul-ctrl.github.io/VDC/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<!-- ▲ ここまでOGP -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ヒーロー ===== -->
  <header class="hero">
    <div class="wrap hero__inner">
      <div class="hero__text">
        <p class="hero__venue">VORZ BAR Darts Contest</p>
        <h1 class="hero__mark">VDC</h1>
        <p class="hero__lead">VORZ BARで行われたダーツ大会の記録です。</p>
        <p class="hero__latest" id="latest"></p>
      </div>
      <div class="hero__board" aria-hidden="true">
        <svg viewBox="-200 -200 400 400" class="board" id="board"></svg>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== 歴代の大会（年表） ===== -->
    <section class="wrap roll-sec" aria-labelledby="rollTitle">
      <div class="sec-head">
        <h2 class="sec-title" id="rollTitle">歴代の大会</h2>
        <p class="tally" id="tally"></p>
      </div>
      <nav class="roll" id="roll" role="tablist" aria-label="大会を選ぶ"></nav>
    </section>

    <!-- ===== 選んだ大会の詳細 ===== -->
    <section class="wrap detail-sec">
      <div id="detail" role="tabpanel" aria-live="polite"></div>
    </section>
  </main>

  <footer class="wrap site-footer">
    <p>VORZ BAR Darts Contest</p>
  </footer>

  <script src="tournaments-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
