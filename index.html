<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VORZ BAR Darts Contest</title>

<!-- ▼ LINEやX、Facebook等で共有したときのプレビュー用（OGP） -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://heso710soul-ctrl.github.io/VDC/">
<meta property="og:title" content="VORZ BAR Darts Contest">
<meta property="og:description" content="VORZ BARで行われたダーツ大会の記録。歴代の優勝者と各回の結果をまとめています。">
<meta property="og:image" content="https://heso710soul-ctrl.github.io/VDC/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<!-- ▲ ここまでOGP -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ヒーロー（写真スライド） =====
       写真を増やすときは images/ に入れて、下の <figure> を1つ増やすだけでOK -->
  <header class="hero" id="hero">
    <div class="hero__slides">
      <figure class="slide is-active"><img src="images/hero-1.jpg" alt="VORZ BARのダーツマシンに向かうプレイヤーの後ろ姿"></figure>
      <figure class="slide"><img src="images/hero-2.jpg" alt="投げる前に構えるプレイヤーと壁に映る影"></figure>
    </div>
    <div class="hero__grain" aria-hidden="true"></div>

    <div class="hero__top wrap">
      <p class="hero__venue">VORZ BAR Darts Contest</p>
      <div class="hero__nav">
        <span class="hero__count" id="slideCount" aria-live="polite">1 / 2</span>
        <button type="button" class="hero__btn" id="slidePrev" aria-label="前の写真">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="hero__btn" id="slideNext" aria-label="次の写真">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div class="hero__bottom wrap">
      <h1 class="hero__mark">VDC</h1>
      <p class="hero__latest" id="latest"></p>
    </div>
  </header>

  <main>
    <section class="wrap board-sec" aria-labelledby="listTitle">
      <div class="board-sec__head">
        <h2 class="sec-title" id="listTitle">歴代の大会</h2>
        <p class="tally" id="tally"></p>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>VORZ BAR Darts Contest</p>
    </div>
  </footer>

  <script src="tournaments-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
